[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repoatlas-1m"
version = "0.1.0"
description = "RepoAtlas-1M: verifiable repository documentation drift and onboarding atlas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gradio>=5.52.0",
  "jinja2>=3.1.6",
  "matplotlib>=3.10.7",
  "pandas>=2.3.3",
  "pydantic>=2.12.3",
  "requests>=2.32.5",
  "tiktoken>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["repoatlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
