repos:
  - name: fastapi
    repo_url: https://github.com/fastapi/fastapi
    ref: master
    reason: API framework with extensive docs/ and frequent release notes touching behaviour defaults.
  - name: django
    repo_url: https://github.com/django/django
    ref: main
    reason: Mature framework with large prose docs and many configuration toggles across settings.
  - name: celery
    repo_url: https://github.com/celery/celery
    ref: main
    reason: Config-heavy task runner where broker/result defaults and env vars frequently evolve.
  - name: airflow
    repo_url: https://github.com/apache/airflow
    ref: main
    reason: Fast-moving orchestration platform with sprawling docs and many CLI/config surfaces.
  - name: dagster
    repo_url: https://github.com/dagster-io/dagster
    ref: master
    reason: Large orchestration codebase with docs and integration-heavy configuration pages.
  - name: prefect
    repo_url: https://github.com/PrefectHQ/prefect
    ref: main
    reason: Workflow system with evolving CLI and cloud profile defaults documented in prose.
  - name: dbt-core
    repo_url: https://github.com/dbt-labs/dbt-core
    ref: main
    reason: SQL build tool with substantial docs and config schema churn across adapters.
  - name: pydantic
    repo_url: https://github.com/pydantic/pydantic
    ref: main
    reason: Rapid API iteration where docs often trail validator/signature behaviour updates.
  - name: typer
    repo_url: https://github.com/fastapi/typer
    ref: master
    reason: CLI framework with docs examples tied closely to default argument handling.
  - name: poetry
    repo_url: https://github.com/python-poetry/poetry
    ref: main
    reason: Config-heavy package manager with docs around lock, source, and resolver settings.
  - name: uv
    repo_url: https://github.com/astral-sh/uv
    ref: main
    reason: Fast-moving Python toolchain with many command/help text and env-var surfaces.
  - name: ruff
    repo_url: https://github.com/astral-sh/ruff
    ref: main
    reason: Linter with many rule/config options documented separately from implementation.
  - name: scrapy
    repo_url: https://github.com/scrapy/scrapy
    ref: master
    reason: Framework docs include many settings and middleware defaults prone to drift.
  - name: streamlit
    repo_url: https://github.com/streamlit/streamlit
    ref: develop
    reason: UI framework with doc-rich configuration and frequent behavioural updates.
  - name: starlette
    repo_url: https://github.com/encode/starlette
    ref: master
    reason: ASGI toolkit where middleware and routing defaults are heavily documented.
  - name: home-assistant-core
    repo_url: https://github.com/home-assistant/core
    ref: dev
    reason: Large integration codebase with substantial docs and config examples across modules.
  - name: great-expectations
    repo_url: https://github.com/great-expectations/great_expectations
    ref: develop
    reason: Data-quality framework with broad prose docs and changing configuration contracts.
  - name: hatch
    repo_url: https://github.com/pypa/hatch
    ref: master
    reason: Project-management CLI with settings-rich docs and plugin-oriented defaults.
  - name: ansible
    repo_url: https://github.com/ansible/ansible
    ref: devel
    reason: Very broad automation repo with docs and module options that can drift over time.
  - name: eslint
    repo_url: https://github.com/eslint/eslint
    ref: main
    reason: JavaScript linter with config-key docs and evolving rule default behaviour.
  - name: vite
    repo_url: https://github.com/vitejs/vite
    ref: main
    reason: Tooling project with fast release cadence and docs-heavy config reference pages.
  - name: nestjs
    repo_url: https://github.com/nestjs/nest
    ref: master
    reason: TypeScript framework with many decorators/options and substantial docs prose.
  - name: pnpm
    repo_url: https://github.com/pnpm/pnpm
    ref: main
    reason: Package manager where CLI flags and workspace config docs can lag implementation.
  - name: webpack
    repo_url: https://github.com/webpack/webpack
    ref: main
    reason: Config-heavy build tool with deep docs and frequently changing plugin semantics.
  - name: playwright
    repo_url: https://github.com/microsoft/playwright
    ref: main
    reason: Testing framework with large docs and many CLI/config flags spread across files.
